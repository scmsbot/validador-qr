<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Validador QR - Hospital Felix Bulnes</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
      min-height: 100vh;
      color: #333;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
      padding: 20px 0;
    }
    .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      margin-bottom: 16px;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .config-info {
      background: #E1F5FE;
      border-left: 4px solid #0288D1;
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 12px;
      color: #0288D1;
    }
    .scanner-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      min-height: 280px;
      display: none;
    }
    #qr-reader { width: 100%; }
    .camera-status {
      text-align: center;
      padding: 40px 20px;
      background: #000;
      border-radius: 12px;
      color: white;
      margin-bottom: 16px;
    }
    .camera-status .icon { font-size: 48px; margin-bottom: 12px; }
    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e1e1e1;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
    }
    .input-group input:focus { outline: none; border-color: #0078D4; }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #0078D4; color: white; }
    .btn-success { background: #107C10; color: white; }
    .btn-secondary { background: #f3f2f1; color: #333; margin-top: 8px; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .footer {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎫 Validador de Acceso</h1>
      <p>Hospital Felix Bulnes</p>
    </div>

    <!-- PANTALLA ESCANEO -->
    <div id="screen-scan" class="card">
      <div class="config-info" id="config-info">
        ⚙️ Verificando configuración...
      </div>

      <div class="scanner-container" id="scanner-container">
        <div id="qr-reader"></div>
      </div>

      <div id="camera-status" class="camera-status">
        <div class="icon">📷</div>
        <p style="margin-bottom: 12px;">Solicitar acceso a cámara...</p>
        <button class="btn btn-primary" onclick="solicitarCamara()">
          🎥 Activar cámara
        </button>
      </div>

      <div class="input-group">
        <label>O ingrese el código manualmente:</label>
        <input type="text" id="codigo-manual" placeholder="FB-XXXXXXXXXXXXXX-XXXXXXXX" autocomplete="off">
      </div>

      <button class="btn btn-primary" onclick="validarCodigoManual()">
        🔍 Validar Código
      </button>
    </div>

    <!-- PANTALLA RESULTADO -->
    <div id="screen-result" class="card hidden">
      <div id="loading-result" style="text-align: center; padding: 40px 20px;">
        <div class="spinner" style="border-color: #ddd; border-top-color: #0078D4; width: 50px; height: 50px; margin: 20px auto;"></div>
        <p>Validando código...</p>
      </div>

      <div id="result-content" class="hidden">
        <div id="result-icon" style="font-size: 64px; text-align: center; margin: 16px 0;"></div>
        <div id="result-message" style="font-size: 24px; font-weight: 700; text-align: center; margin: 20px 0;"></div>
        <div id="result-status" style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; margin: 0 auto 20px; text-align: center;"></div>

        <div id="visitor-data" style="background: #f9f9f9; border-radius: 10px; padding: 16px; margin: 16px 0; display: none;"></div>

        <button id="btn-confirm" class="btn btn-success hidden" onclick="confirmarIngreso()">
          ✅ Confirmar Ingreso
        </button>

        <button class="btn btn-secondary" onclick="volverEscaneo()">
          ← Volver
        </button>
      </div>
    </div>

    <!-- PANTALLA ÉXITO -->
    <div id="screen-success" class="card hidden">
      <div style="text-align: center; padding: 40px 20px;">
        <div style="font-size: 80px; margin-bottom: 20px; animation: bounce 0.6s ease;">🎉</div>
        <h2 style="color: #107C10; margin-bottom: 10px;">¡Bienvenido!</h2>
        <p id="success-name" style="font-size: 18px; font-weight: 600; margin-bottom: 8px;"></p>
        <p id="success-time" style="color: #666; font-size: 14px;"></p>
        <p style="color: #999; font-size: 12px; margin-top: 20px;">
          Volviendo en <span id="countdown">10</span>s...
        </p>
        <button class="btn btn-primary" style="margin-top: 20px;" onclick="volverEscaneo()">
          Validar otro código
        </button>
      </div>
    </div>

    <div class="footer">
      Sistema Control de Acceso · PWA v4.0
    </div>
  </div>

  <script>
    // ⚠️ EDITAR ESTA LÍNEA CON TU URL DE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbzejx9Q6-Qja7dbpvhg3JQ-DiiqMhNFBNTaXxzJWcWsv02gMa0APjR94r-18w2LBXkH7g/exec';

    let html5QrCode = null;
    let codigoActual = null;

    window.addEventListener('load', () => {
      verificarConfiguracion();
      const qrParam = new URLSearchParams(window.location.search).get('qr');
      if (qrParam) {
        document.getElementById('codigo-manual').value = qrParam;
        setTimeout(() => validarCodigoManual(), 300);
      }
    });

    function verificarConfiguracion() {
      const configInfo = document.getElementById('config-info');
      if (API_URL.includes('YOUR_SCRIPT_ID')) {
        configInfo.innerHTML = `
          <strong>⚠️ Configuración incompleta</strong><br>
          Edita index.html y reemplaza YOUR_SCRIPT_ID_HERE con tu Script ID
        `;
        configInfo.style.background = '#FFEBEE';
        configInfo.style.color = '#C4314B';
        configInfo.style.borderLeftColor = '#C4314B';
      } else {
        configInfo.innerHTML = `
          ✅ Conectado a API
        `;
        configInfo.style.background = '#E8F5E9';
        configInfo.style.color = '#107C10';
        configInfo.style.borderLeftColor = '#107C10';
      }
    }

    async function solicitarCamara() {
      const statusEl = document.getElementById('camera-status');
      if (!navigator.mediaDevices?.getUserMedia) {
        statusEl.innerHTML = '❌ Tu navegador no soporta cámara';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        stream.getTracks().forEach(t => t.stop());
        statusEl.style.display = 'none';
        document.getElementById('scanner-container').style.display = 'block';
        iniciarEscaner();
      } catch (error) {
        statusEl.innerHTML = `
          <div class="icon">❌</div>
          <p style="margin-bottom: 12px;">Error: ${error.name}</p>
          <button class="btn btn-secondary" onclick="solicitarCamara()">🔄 Reintentar</button>
        `;
      }
    }

    async function iniciarEscaner() {
      try {
        if (html5QrCode?.isScanning) await html5QrCode.stop();
        html5QrCode = new Html5Qrcode("qr-reader");
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (texto) => {
            html5QrCode.stop();
            validarCodigo(texto);
          },
          () => {}
        );
      } catch (err) {
        console.error('Error escáner:', err);
      }
    }

    function validarCodigoManual() {
      const codigo = document.getElementById('codigo-manual').value.trim();
      if (!codigo) {
        alert('⚠️ Ingrese un código');
        return;
      }
      if (html5QrCode?.isScanning) html5QrCode.stop();
      validarCodigo(codigo);
    }

    async function validarCodigo(codigo) {
      codigoActual = codigo;
      document.getElementById('screen-scan').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      document.getElementById('loading-result').style.display = 'block';
      document.getElementById('result-content').classList.add('hidden');

      try {
        const url = `${API_URL}?action=validar&qr=${encodeURIComponent(codigo)}`;
        const response = await fetch(url);
        const data = await response.json();
        mostrarResultado(data);
      } catch (error) {
        mostrarResultado({
          ok: false,
          estado: 'ERROR',
          mensaje: '❌ Error de conexión'
        });
      }
    }

    function mostrarResultado(data) {
      document.getElementById('loading-result').style.display = 'none';
      document.getElementById('result-content').classList.remove('hidden');

      const iconos = {
        'VALIDO': '✅', 'NO_EXISTE': '❌', 'YA_USADO': '⚠️',
        'EXPIRADO': '⏰', 'BLOQUEADO': '🔒', 'CANCELADO': '🚫', 'ERROR': '❓'
      };

      document.getElementById('result-icon').textContent = iconos[data.estado] || '❓';
      document.getElementById('result-message').textContent = data.mensaje;

      const statusEl = document.getElementById('result-status');
      statusEl.textContent = data.estado.replace('_', ' ');
      statusEl.className = 'estado-badge estado-' + data.estado;

      if (data.ok && data.datos) {
        const datosEl = document.getElementById('visitor-data');
        let html = `
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span style="color: #666; font-weight: 500;">👤 Visitante</span>
            <span style="color: #333; font-weight: 600;">${data.datos.personaIngresa || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span style="color: #666; font-weight: 500;">✍️ Autoriza</span>
            <span style="color: #333; font-weight: 600;">${data.datos.personaAutoriza || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span style="color: #666; font-weight: 500;">🏢 Empresa</span>
            <span style="color: #333; font-weight: 600;">${data.datos.empresa || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span style="color: #666; font-weight: 500;">📍 Área</span>
            <span style="color: #333; font-weight: 600;">${data.datos.area || '-'}</span>
          </div>
        `;
        datosEl.innerHTML = html;
        datosEl.style.display = 'block';
        document.getElementById('btn-confirm').classList.remove('hidden');
      } else {
        document.getElementById('visitor-data').style.display = 'none';
        document.getElementById('btn-confirm').classList.add('hidden');
      }
    }

    async function confirmarIngreso() {
      const btn = document.getElementById('btn-confirm');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Procesando...';

      try {
        const url = `${API_URL}?action=confirmar&qr=${encodeURIComponent(codigoActual)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.ok) {
          mostrarExito(data);
        } else {
          alert('⚠️ ' + data.mensaje);
          btn.disabled = false;
          btn.innerHTML = '✅ Confirmar Ingreso';
        }
      } catch (error) {
        alert('❌ Error: ' + error.message);
        btn.disabled = false;
        btn.innerHTML = '✅ Confirmar Ingreso';
      }
    }

    function mostrarExito(data) {
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-success').classList.remove('hidden');
      document.getElementById('success-name').textContent = data.nombre;
      document.getElementById('success-time').textContent = 'Ingreso registrado a las ' + data.hora;

      let segundos = 10;
      setInterval(() => {
        segundos--;
        document.getElementById('countdown').textContent = segundos;
        if (segundos <= 0) volverEscaneo();
      }, 1000);
    }

    function volverEscaneo() {
      document.getElementById('codigo-manual').value = '';
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-success').classList.add('hidden');
      document.getElementById('screen-scan').classList.remove('hidden');
      iniciarEscaner();
    }
  </script>
</body>
</html>
